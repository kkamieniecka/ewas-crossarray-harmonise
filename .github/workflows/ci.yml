name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  numerical-tests:
    name: numerical core (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy scipy pandas
      - name: property checks on ewasml.py
        run: python tests/test_ewasml.py

  cross-language-equivalence:
    name: R core reproduces the Python core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy pandas
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # Matrix ships with R. limma is deliberately not installed here: the
      # test treats its comparison as informational and skips it when absent,
      # so CI stays fast while still checking the ported moderation.
      - name: R dependencies
        run: install.packages(c("optparse", "jsonlite"))
        shell: Rscript {0}
      - name: fixtures and reference outputs from the Python core
        run: python tests/gen_equivalence_fixtures.py --out-dir fx --stage-dir stage
      - name: R must reproduce them
        run: Rscript tests/test_equivalence.R fx
      # The function-level fixtures above cannot reach driver code, where both
      # defects the port exposed lived (state labelling, non-finite values in
      # the parameters record). This runs the two stage-05 drivers end to end
      # and compares every output file, including the case where an array arm
      # is unidentified and the cross-array fields are undefined.
      - name: stage 05 drivers must agree end to end
        run: python tests/test_stage05_equivalence.py stage

  galaxy-wrappers:
    name: Galaxy wrapper XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: well-formedness
        run: xmllint --noout galaxy/*.xml
      - name: macro tokens and xml macros are all defined
        run: |
          missing=0
          # <token name="@X@"> — the name attribute carries the @ delimiters
          for tok in $(grep -ho '@[A-Z_]\+@' galaxy/ewas_*.xml | sort -u); do
            grep -q "token name=\"$tok\"" galaxy/macros.xml || {
              echo "undefined token: $tok"; missing=1; }
          done
          # <expand macro="x"/> must match an <xml name="x">
          for mac in $(grep -ho 'macro="[a-z_]\+"' galaxy/ewas_*.xml \
                       | sed 's/macro="//;s/"//' | sort -u); do
            grep -q "xml name=\"$mac\"" galaxy/macros.xml || {
              echo "undefined macro: $mac"; missing=1; }
          done
          exit $missing

  nextflow-config:
    name: Nextflow config and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
      - name: every profile resolves
        run: |
          fail=
          for p in conda docker singularity test; do
            if ! out=$(nextflow config . -profile "$p" 2>&1); then
              msg=$(printf '%s' "$out" | tail -40)
              echo "::error title=profile $p::${msg//$'\n'/%0A}"
              fail=1
            fi
          done
          [ -z "$fail" ]
      - name: workflow parses
        run: |
          # `nextflow run . --help` would execute the workflow (there is no --help
          # handler) and exit 1 on the required --sheet check. `lint` checks the
          # script and config syntax without running anything.
          if ! out=$(nextflow lint main.nf nextflow.config 2>&1); then
            msg=$(printf '%s' "$out" | tail -40)
            echo "::error title=lint::${msg//$'\n'/%0A}"
            exit 1
          fi
          printf '%s\n' "$out"
