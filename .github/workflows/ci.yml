name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  numerical-tests:
    name: numerical core (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy scipy pandas
      - name: property checks on ewasml.py
        run: python tests/test_ewasml.py

  galaxy-wrappers:
    name: Galaxy wrapper XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: well-formedness
        run: xmllint --noout galaxy/*.xml
      - name: macro tokens and xml macros are all defined
        run: |
          missing=0
          # <token name="@X@"> — the name attribute carries the @ delimiters
          for tok in $(grep -ho '@[A-Z_]\+@' galaxy/ewas_*.xml | sort -u); do
            grep -q "token name=\"$tok\"" galaxy/macros.xml || {
              echo "undefined token: $tok"; missing=1; }
          done
          # <expand macro="x"/> must match an <xml name="x">
          for mac in $(grep -ho 'macro="[a-z_]\+"' galaxy/ewas_*.xml \
                       | sed 's/macro="//;s/"//' | sort -u); do
            grep -q "xml name=\"$mac\"" galaxy/macros.xml || {
              echo "undefined macro: $mac"; missing=1; }
          done
          exit $missing

  nextflow-config:
    name: Nextflow config and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
      - name: every profile resolves
        run: |
          for p in conda docker singularity test; do
            echo "--- profile: $p"
            nextflow config . -profile $p > /dev/null || exit 1
          done
      - name: workflow parses
        run: nextflow run . --help
